[project]
name = "multi-llm-router-gateway"
version = "0.1.0"
description = "Intelligent multi-LLM router gateway over OpenRouter: cost/latency/safety-aware 3-tier routing"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.0",
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "langfuse>=4.15.6",
    "loguru>=0.7.3",
    "openai>=3.22.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
